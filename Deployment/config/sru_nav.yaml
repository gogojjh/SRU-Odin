# Runtime parameters for sru_nav_node (Go2 + Odin1).
# Load via:  <rosparam command="load" file="$(find sru_nav_go2_ros1)/config/sru_nav.yaml"/>

# ---- Topics ---------------------------------------------------------------
depth_topic:    "/odin1/depth_img_competetion"   # sensor_msgs/Image (32FC1, meters)
odom_topic:     "/odin1/odometry_highfreq"       # nav_msgs/Odometry @ ~400 Hz (IMU rate), header.frame_id=odom, child_frame_id=imu (实测)
                                                 #   alt: /odin1/odometry @ ~10 Hz (SLAM rate, less drift but laggier)
joy_topic:      "/joy"                           # sensor_msgs/Joy (PS5-like layout)
goal_topic:     "/goal_pose"                     # geometry_msgs/PoseStamped
cmd_vel_topic:  "/cmd_vel"                       # geometry_msgs/Twist (consumed by Go2 sport mode)

# ---- Model files (leave empty -> auto-discover under <pkg>/models/) -------
vae_model_path:    ""
policy_model_path: ""

# ---- Depth filter ---------------------------------------------------------
min_depth: 0.25                                  # meters
max_depth: 10.0                                  # meters

# ---- Control --------------------------------------------------------------
control_frequency: 5.0                           # Hz (matches training)
# Conservative defaults for Go2 (original B2W used [1.5, 1.0, 1.0]). Tune up
# gradually during real testing.
policy_scale: [0.60, 0.27, 0.90]                 # [vx_max, vy_max, omega_max]
# 2026-08-26：跟 go2_bridge.yaml 的 max_vx/vy/wz 对齐。桥那侧是硬截断
# (go2_core/sport.py 的 _clamp)，不是等比缩放——SRU 算 0.6 会被直接剪成
# 0.2，而 SRU 是闭环策略，以为自己在跑 0.6、实际只走 0.2，下一步判断全错，
# 走起来左右摆。想提速要两边一起改。
# 2026-08-26 二次修正：只对齐上限还不够——三个轴不是等比降的，vx 降到
# 训练值(1.5)的 1/7.5，omega 只降到 1/3.3，等于同样前进距离下转向幅度被
# 放大了 2.25 倍(转弯半径 R=vx/omega 从训练时的 ~1.5 m 缩到 0.67 m)。策略
# 以为转一点点身子早就跟上了，实际身子没走多远头已经转过，下一步反打修正，
# 就是画龙式左右摇摆的根因。把 vx 提到 0.45 使 R=0.45/0.30=1.5 与训练一致
# (go2_bridge.yaml 的 max_vx/vy 需同步改到 0.45/0.20，否则被硬剪回原样)。
# 2026-08-27 三次修正：用户要求最大自动速度提到 0.6。保持上面确认过的
# R=vx/omega=1.5 不变(否则会引入反方向的失配:狗跑得快、转得相对慢，
# 转弯/避障时方向修正跟不上速度，容易蹭到障碍物边缘)——vx=0.60 时
# omega 同步提到 0.40 (R=0.60/0.40=1.5)，vy 按同一比例(0.20/0.45=0.444)
# 换算到 0.6*0.444≈0.27。go2_bridge.yaml 的 max_vx/vy/wz 需同步改到
# 0.60/0.27/0.40。
# 2026-08-27 四次修正：用户要求最大速度再提到 1.0，随后现场测试后又要求
# 退回 0.6。继续保持同一套比例(R=vx/omega≈1.5，vy≈vx*0.45)：1.0 m/s 时是
# omega=0.67、vy=0.45；退回 0.60 时对应 omega=0.40、vy=0.27。
# 2026-08-27 五次修正：真机测试反馈转向(omega)偏慢，要求提到当时值的 2.5 倍
# (0.40→1.00)。字面执行会把 R=vx/omega 从 1.5 拉到 0.6——比最初触发画龙摇摆
# 那次的 0.67 还偏离训练值，理论上风险更高。跟用户对齐后采用折中方案：只把
# omega 提到 1.5 倍(0.40→0.60)，vx/vy 不动，R=0.60/0.60=1.0，权衡"转向变快"
# 和"不要比当初摇摆时更偏离训练比例"。go2_bridge.yaml 的 max_wz 需同步改到
# 0.60（max_vx/max_vy 不变，仍是 0.60/0.27）。这次改动没有离线基准可验证，
# 必须在空旷场地实测转向，留意"转过头反打"的画龙迹象；如果还嫌慢可以继续往
# omega=1.00(R=0.6)逼近，如果出现摇摆就退回 0.40 或更保守。
# 2026-09-02 六次修正：用户要求转向速率再提到当时值的 1.5 倍（0.60→0.90），
# vx/vy 不动。go2_bridge.yaml 的 max_wz 同步改到 0.90。
# ⚠️ 这一改把转弯半径 R=vx/omega 从 1.0 拉到 0.60/0.90=0.67 —— 正好回到
# 2026-08-26 触发「画龙式左右摇摆」的那个比例（当时是 0.67，训练值 1.5）。
# 摇摆的机理见上面第二次修正那段：狗身子还没走多远、头已经转过去了，策略下一
# 步反打修正，来回振荡。所以这次**必须先在空旷场地直线 + 单个拐角各试一趟**，
# 盯「转过头再反打」的迹象。真出现摇摆有两条退路：退回 omega=0.60，
# 或者把 vx 一起提到 0.90 把 R 拉回 1.0（但那会改变最大前进速度，
# 而 0.60 是 08-27 现场定下来的，动之前要先问）。
lateral_velocity_scale: 1.0                      # 额外叠加在 vy 上的阻尼系数
# 原值 0.6 会把 vy 实际上限压到 0.10*0.6=0.06 m/s(训练时 vy 通道有
# 0.6~1.0 m/s 可用)，等于策略几乎不能横移避障，只能靠转向躲，进一步
# 把避障动作都挤到 omega 通道上、加剧摇摆。改成 1.0 即用满 policy_scale[1]。
low_pass_filter_coef: [0.5, 0.5, 0.5]            # 一阶低通: 新=a*本次+(1-a)*上次
# 原值 [0.9, 0.5, 0.5] 里 vx 的 a=0.9 几乎不滤波(换算成训练侧写法
# alpha=1-a=0.1，而 Go2 训练时 alpha 随机化范围是 [0.3,0.7]，vx 通道的
# 平滑程度落在训练分布之外)。统一改成 0.5，三轴都对应训练侧 alpha=0.5。
arrive_goal_threshold: 0.25                      # meters，到点判定阈值
# 2026-08-27 从0.75改到0.25，配合探索真机侧单步动作幅度放大(转45°/走0.5米，
# 见 deploy_go2.launch fsm/action_distance、fsm/action_angle_deg)，让"到点"
# 更贴近实际位移意图。_check_near_goal 的"接近判定"阈值是本值的2倍，会
# 跟着从1.5米联动降到0.5米。lookahead(snownav_go2_executor.py，2.5米)不用
# 跟着调：阈值变小后安全余量(2.5m目标点 vs 0.25m判定圈)反而更大。

# ---- 目标点跳变时是否重置 LSTM 隐状态 -------------------------------------
# false（真机现在用的）：不重置。
#   2026-08-27 起 C++ 探索规划器直接发它算好的真实目标点（fsm/publish_goal），
#   目标点会随前沿地图更新持续变化——这是信息，不是噪声：前沿点变了说明狗看到
#   了新东西，目标就该跟着变，策略也该带着记忆连续跟随。如果每次目标一动就把
#   LSTM 抹掉，策略永远处于冷启动，等于退化成只看当前一帧的反应式控制器；而且
#   重置会连带把 cmd_vel 的低通滤波历史归零（_reset_last_action），把连续控制
#   想要的平滑性一起打断。
# true（旧行为）：目标点跳变超过 GOAL_JUMP_RESET_DISTANCE(1.0 米，constants.py)
#   就重置。这是为"执行器每转完一次弯就把前瞻点整体挪 1.9 米"那种台阶式跳变
#   准备的补救措施，现在源头没有了。
# 注意：手柄上的手动重置按钮和"到达目标后清空"两条路径不受本开关影响。
reset_hidden_on_goal_jump: false

# ---- Sim flag -------------------------------------------------------------
# When true the odom twist is treated as already in the base frame.
use_sim: false

# ---- Joystick deadman -----------------------------------------------------
# true  (default, SAFE): /cmd_vel stays 0 until a /joy publisher exists AND
#                        axes[4] (throttle trigger) is pushed; 15 s without
#                        /joy forces a stop. Use this on real hardware.
# false (TESTING ONLY) : skip the deadman; cmd_vel_ratio starts at 1.0 and
#                        the timeout check is disabled. Useful for headless
#                        / autonomous closed-loop tests with no operator.
require_joystick: true
